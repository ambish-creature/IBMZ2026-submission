limit_req_zone $binary_remote_addr zone=image_detector:10m rate=30r/m;

server {
    listen 80;
    server_name 148.100.109.177;

    location = /image/health {
        proxy_pass http://127.0.0.1:8082/health;
        proxy_connect_timeout 5s;
        proxy_read_timeout 10s;
    }

    location = /image/detect {
        client_max_body_size 20m;
        client_body_timeout 15s;
        limit_req zone=image_detector burst=5 nodelay;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Access-Control-Allow-Methods "POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type" always;

        if ($request_method = OPTIONS) {
            return 204;
        }

        proxy_pass http://127.0.0.1:8082/detect;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
